name: Reusable Build

on:
  workflow_call:
    secrets:
      MS_TEAMS_WEBHOOK:
        required: false
    inputs:
      java-version:
        description: 'Java version to use'
        default: '25'
        type: string
      maven-args:
        description: 'Arguments passed to ./mvnw'
        default: '--batch-mode verify'
        type: string
      triggered-manually:
        description: 'Set to true when the calling workflow was triggered via workflow_dispatch'
        default: false
        type: boolean

jobs:
  check-membership:
    if: inputs.triggered-manually == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor;
            let isMember = false;
            try {
              const res = await github.rest.orgs.checkMembershipForUser({
                org: 'jme-admin-ch',
                username: actor,
              });
              isMember = res.status === 204;
            } catch (_) {}
            if (!isMember) {
              core.setFailed(`${actor} is not a member of jme-admin-ch`);
            }

  build:
    needs: [check-membership]
    if: always() && (needs.check-membership.result == 'success' || needs.check-membership.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-jdk-${{ inputs.java-version }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-jdk-${{ inputs.java-version }}-
      - name: Copy Maven settings for sub-process builds
        run: cp "$HOME/.m2/settings.xml" settings.xml 2>/dev/null || echo '<settings/>' > settings.xml
      - name: Build with Maven
        run: env -u CI ./mvnw ${{ inputs.maven-args }}

  notify-build-result:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'failure')
    uses: jme-admin-ch/.github/.github/workflows/notify-build-result.yml@main
    with:
      result: ${{ needs.build.result }}
    permissions:
      contents: read
      issues: write
      pull-requests: write

  notify-ms-teams:
    needs: build
    if: always() && needs.build.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Microsoft Teams in case of build failure
        env:
          MS_TEAMS_WEBHOOK: ${{ secrets.MS_TEAMS_WEBHOOK }}
          BUILD_STATUS: ${{ needs.build.result }}
        run: |
          set -o pipefail
          if [ -z "$MS_TEAMS_WEBHOOK" ]; then
            echo "MS_TEAMS_WEBHOOK is not configured"
            exit 0
          fi

          case "$BUILD_STATUS" in
            success)
              STATUS_ICON="🟢"
              STATUS_TEXT="Success"
              ;;
            failure)
              STATUS_ICON="🔴"
              STATUS_TEXT="Failed"
              ;;
            cancelled)
              STATUS_ICON="🟡"
              STATUS_TEXT="Cancelled"
              ;;
            *)
              STATUS_ICON="⚪"
              STATUS_TEXT="$BUILD_STATUS"
              ;;
          esac

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          jq -n \
            --arg workflow "${{ github.workflow }}" \
            --arg project "${{ github.repository }}" \
            --arg status "$STATUS_TEXT" \
            --arg statusIcon "$STATUS_ICON" \
            --arg repository "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg actor "${{ github.actor }}" \
            --arg runId "${{ github.run_id }}" \
            --arg runUrl "$RUN_URL" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        text: "GitHub Actions",
                        weight: "Bolder",
                        size: "Medium"
                      },
                      {
                        type: "TextBlock",
                        text: ($workflow + " • " + $project),
                        weight: "Bolder",
                        size: "Large",
                        wrap: true
                      },
                      {
                        type: "FactSet",
                        facts: [
                          {
                            title: "Status",
                            value: ($statusIcon + " " + $status)
                          },
                          {
                            title: "Repository",
                            value: $repository
                          },
                          {
                            title: "Branch",
                            value: $branch
                          },
                          {
                            title: "Commit",
                            value: ($commit[0:7])
                          },
                          {
                            title: "Triggered by",
                            value: $actor
                          },
                          {
                            title: "Run",
                            value: ("#" + $runId)
                          }
                        ]
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "View GitHub Actions run",
                        url: $runUrl
                      }
                    ]
                  }
                }
              ]
            }' |
          http_code=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            -H "Content-Type: application/json" \
            --data-binary @- \
            "$MS_TEAMS_WEBHOOK" 2>/dev/null)
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Teams notification failed (HTTP status: $http_code)"
            exit 1
          fi
